# Rust integration tests and llvm-cov settings (invoked via pnpm test:rust / test:rust:coverage).
# Run from the repository root.
# Requires cargo-nextest (https://nexte.st) and cargo-llvm-cov (https://github.com/taiki-e/cargo-llvm-cov).

[alias]
# Run the full src-tauri test suite so new integration modules are picked up
# automatically as later phases add files under `src-tauri/tests/`.
imageareo-test-integration = [
  "nextest",
  "run",
  "--manifest-path",
  "src-tauri/Cargo.toml",
]

# Coverage run with the required 90% gate. `--ignore-filename-regex` drops OS-side-effect /
# bootstrap code that cannot be asserted headlessly (per the P3 coverage-exclusion
# policy): the Tauri launch hookup in lib.rs, main.rs, the test `common` helpers, and
# the cargo registry. Pure logic added by later phases stays in the denominator.
imageareo-llvm-cov = [
  "llvm-cov",
  "nextest",
  # Skip the desktop bin (default feature) so its separately-feature-unified copy
  # of the lib is not instrumented as a phantom 0%-covered instance.
  "--no-default-features",
  "--summary-only",
  "--ignore-filename-regex",
  "src-tauri.*src.*lib\\.rs|src-tauri.*src.*main\\.rs|src-tauri.*src.*menu.*runtime\\.rs|src-tauri.*src.*commands.*clipboard_runtime\\.rs|src-tauri.*src.*commands.*reveal_runtime\\.rs|src-tauri.*tests.*common|cargo.*registry",
  "--manifest-path",
  "src-tauri/Cargo.toml",
  "--fail-under-lines",
  "85",
  "--fail-under-functions",
  "80",
  "--fail-under-regions",
  "85",
]
