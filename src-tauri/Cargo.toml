[package]
name = "imageareo"
version = "1.3.4"
description = "Lightweight, fast, modern cross-platform desktop image viewer."
authors = ["ImageAreo contributors"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "imageareo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The desktop binary is gated behind a default-on feature so coverage runs can
# disable it (`--no-default-features`). Building the bin would otherwise compile a
# SECOND copy of the lib with different `tauri` feature unification than the test
# rlib (the dev-only `tauri/test` feature), and cargo-llvm-cov would report that
# never-executed copy as a phantom 0%-covered instance, sinking the gate. The
# feature is on by default, so `tauri dev`/`tauri build` are unaffected.
[[bin]]
name = "imageareo"
path = "src/main.rs"
required-features = ["desktop-binary"]

[features]
default = ["desktop-binary"]
desktop-binary = []

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "~2.11", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "~2.3"
tauri-plugin-dialog = "~2.7"
tauri-plugin-opener = "~2.5"
tauri-plugin-prevent-default = "~5.0"
tauri-plugin-window-state = "~2.4"
arboard = "3.6.1"
base64 = "~0.22"
exif = { package = "kamadak-exif", version = "0.6.1" }
fast_image_resize = "5.1.2"
heic = { version = "0.1.6", features = ["av1"] }
image = { version = "0.25.10", default-features = false, features = ["avif", "bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
# Cheap, format-aware header-only dimension reads (no pixel decode). Covers the
# heavy formats (HEIC/JXL/AVIF/TIFF) that `image` can't probe reliably; the
# decode preflight + `probe_image` command fall back to `image::image_dimensions`
# for anything it does not recognize.
imagesize = "0.13"
jxl-oxide = "0.12.5"
# Single-flight coalescing for decode-class work. `moka::future::Cache::get_with`
# runs the leader once and joins duplicate/returning callers to the same in-flight
# future. Pinned to 0.12.15, verified during planning to have NO dependency on the
# `time` crate, so it does not conflict with the fragile `time = "=0.3.47"` pin.
moka = { version = "0.12.15", features = ["future"] }
rawler = "0.7.2"
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
# Scheduler concurrency primitives (Semaphore / Notify / oneshot) used by the
# decode scheduler. Only the `sync` feature is needed; the async runtime is
# Tauri's (`tauri::async_runtime`, itself tokio). `tokio-util` is intentionally
# NOT added — the scheduler has no cancellation (running jobs always finish).
tokio = { version = "~1", features = ["sync"] }
tauri-plugin-store = "~2.4"
tauri-plugin-updater = { version = "~2.10", features = ["rustls-tls"] }
tauri-plugin-process = "2"
jpeg-decoder = "0.3.2"
# Pinned: time 0.3.48 / time-macros 0.2.28 fail to compile under rustc 1.95 with a
# spurious E0119 (conflicting `From<HourBase>` impl) inside tauri-utils & cookie.
# 0.3.47 is the lowest the tree allows (plist requires >= 0.3.47). Remove once a
# fixed time release lands. Transitive-only dep, pinned here to hold the lockfile.
time = "=0.3.47"
# Pinned: alloc-no-stdlib 3.0.0 was published, and cargo greedily picks it for
# alloc-stdlib 0.2.3 and brotli-decompressor 5.0.2 (whose ranges allow <4). But
# brotli 8.0.3 (pulled transitively by tauri) requires alloc-no-stdlib ^2.0, so
# the tree ends up with both 2.x and 3.x. A direct pin on alloc-no-stdlib can't
# fix this — the two majors just coexist — so brotli's `BrotliAlloc` impls fail to
# resolve (E0277 on `StandardAlloc: Allocator<…>`), built against a different
# alloc-no-stdlib than alloc-stdlib's `StandardAlloc`. Instead pin the two crates
# that pull 3.0.0 down to releases whose alloc-no-stdlib req is ^2.0, so nothing
# in the tree admits 3.x and everything unifies on 2.0.4. Transitive-only deps,
# pinned in Cargo.toml so they survive lockfile regeneration. Remove once brotli
# ships a release with consistent alloc-no-stdlib versions across the tree.
alloc-stdlib = "=0.2.2"
brotli-decompressor = "=5.0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
# Integration-test harness (P3). `tempfile` builds isolated fixture folders;
# `tokio` test-util drives async command bodies; the `tauri` test feature lets
# integration tests construct a mock app context.
ctor = "~0.2"
filetime = "~0.2"
# Names the `PixelFormat` enum that `image::__test_support::image_from_jpeg_pixels_for`
# accepts, so the scaled-JPEG pixel-mapping branches can be unit-tested directly.
jpeg-decoder = "0.3.2"
tempfile = "~3.20"
tokio = { version = "~1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
tauri = { version = "~2.11", features = ["test"] }

# Compile dependencies with full optimization even in the dev profile. Image
# decode/resize/encode (rawler, image, fast_image_resize, jxl-oxide, heic) is
# SIMD- and loop-heavy; unoptimized it is 5-10x slower, which dominated RAW
# `tauri:dev` decode time.
[profile.dev.package."*"]
opt-level = 3

# Our own crate also needs a mild optimization in dev. `fast_image_resize`'s
# `resize()` is generic, so its hot convolution loop is monomorphized *into this
# crate* and would otherwise inherit opt-level 0 — making a single large downscale
# take ~10s in `tauri:dev` (it is ~0.3s here, and ~0.2s in release). opt-level 1
# keeps incremental rebuilds fast while removing that cliff.
[profile.dev]
opt-level = 1
